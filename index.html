<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 15px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        #canvas-box { position: relative; width: 100%; height: 180px; background: #000; border-radius: 8px; border: 2px solid #e50914; margin-bottom: 10px; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        .mult { font-size: 32px; font-weight: bold; color: #00ff66; margin: 5px 0; }
        input { width: 90%; padding: 10px; margin: 6px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
        button { width: 95%; padding: 12px; font-weight: bold; font-size: 16px; border-radius: 8px; border: none; cursor: pointer; margin-top: 5px; }
        .btn-red { background: #e50914; color: #fff; }
        .btn-green { background: #00c853; color: #fff; }
        .btn-support { background: #229ED9; color: #fff; display: block; text-decoration: none; font-weight: bold; padding: 12px; border-radius: 8px; margin-top: 10px; }
        .ref { font-size: 13px; color: #00ff66; word-break: break-all; background: #222; padding: 6px; border-radius: 6px; margin-top: 5px; }
        .admin-card { background: #2d1313; border: 1px solid #ff4444; display: none; }
    </style>
</head>
<body>

    <h2>🚀 Aviator Game</h2>

    <!-- Game Screen -->
    <div class="card">
        <div id="canvas-box">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div class="mult" id="multText">1.00x</div>
        <input type="number" id="betVal" placeholder="Bet Amount (₹)">
        <button id="mainBtn" class="btn-red" onclick="action()">Place Bet</button>
    </div>

    <!-- Wallet Info -->
    <div class="card">
        <h3>Wallet Balance: ₹<span id="bal">0</span></h3>
        <p style="font-size:12px; color:#aaa;">ID: <span id="uId">...</span></p>
    </div>

    <!-- Add Fund / Deposit Section -->
    <div class="card">
        <h3>💳 Deposit / Add Fund</h3>
        <p style="font-size: 12px; color: #aaa;">Paytm / UPI QR Par Pay Karke UTR Daalein</p>
        <input type="number" id="depAmt" placeholder="Enter Amount (₹)">
        <input type="text" id="depUtr" placeholder="Enter 12-Digit UTR Number">
        <button class="btn-green" onclick="submitDeposit()">Submit Deposit</button>
    </div>

    <!-- Refer & Earn Section -->
    <div class="card">
        <h3>🎁 Refer & Earn (₹100)</h3>
        <div class="ref" id="refLink">Loading...</div>
    </div>

    <!-- Withdrawal Section -->
    <div class="card">
        <h3>💸 Withdraw (Min ₹200)</h3>
        <input type="number" id="wAmt" placeholder="Amount (Min ₹200)">
        <input type="text" id="wUpi" placeholder="UPI ID">
        <button class="btn-red" onclick="withdraw()">Submit Request</button>
    </div>

    <!-- Admin Panel (Only visible to Admin) -->
    <div class="card admin-card" id="adminPanel">
        <h3 style="color:#ff4444;">🛠️ Admin Control Panel</h3>
        <input type="text" id="targetUser" placeholder="Target User Telegram ID">
        <input type="number" id="addAmt" placeholder="Amount to Add/Deduct">
        <div style="display:flex; gap:10px; justify-content:center;">
            <button class="btn-green" style="width:45%;" onclick="adminBalance(true)">+ Add Balance</button>
            <button class="btn-red" style="width:45%;" onclick="adminBalance(false)">- Deduct</button>
        </div>
    </div>

    <!-- Support Button -->
    <a href="https://t.me/Yadav63070" target="_blank" class="btn-support">🎧 Contact Support</a>

    <script>
        const ADMIN_ID = "6247495377"; // Aapka Admin ID Set Hai

        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe?.user || { id: "6247495377", first_name: "Puneet" };
        document.getElementById('uId').innerText = user.id;

        // Show Admin Panel if User is Admin
        if (user.id.toString() === ADMIN_ID) {
            document.getElementById('adminPanel').style.display = "block";
        }

        const firebaseConfig = { databaseURL: "https://aviator-app-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('refLink').innerText = `https://t.me/puneetrashibot?start=${user.id}`;

        let balance = 0;
        const uRef = db.ref('users/' + user.id);
        uRef.on('value', (s) => {
            const data = s.val();
            if (data) {
                balance = data.balance || 0;
                document.getElementById('bal').innerText = balance;
            } else {
                let refBy = tg.initDataUnsafe?.start_param;
                if (refBy && refBy !== user.id.toString()) {
                    db.ref('users/' + refBy + '/balance').transaction(c => (c || 0) + 100);
                }
                uRef.set({ name: user.first_name, balance: 0, referredBy: refBy || null });
            }
        });

        // Canvas Setup & Curved Graph Animation
        const cvs = document.getElementById('gameCanvas');
        const ctx = cvs.getContext('2d');

        function resizeCanvas() {
            cvs.width = cvs.offsetWidth;
            cvs.height = cvs.offsetHeight;
        }
        resizeCanvas();

        let running = false, mult = 1.00, timer, crash = 0, bet = 0;
        let points = [];

        function drawGraph() {
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            
            if (points.length < 2) return;

            // Draw Red Curved Line
            ctx.beginPath();
            ctx.strokeStyle = '#e50914';
            ctx.lineWidth = 4;
            ctx.moveTo(points[0].x, points[0].y);

            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();

            // Draw Plane Rocket Head
            const last = points[points.length - 1];
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(last.x, last.y, 7, 0, Math.PI * 2);
            ctx.fill();
        }

        function action() {
            const btn = document.getElementById('mainBtn');
            if (!running) {
                const input = parseFloat(document.getElementById('betVal').value);
                if (!input || input <= 0) return alert("Valid amount daalein!");
                if (input > balance) return alert("Low balance!");
                
                bet = input;
                balance -= bet;
                uRef.update({ balance: balance });

                running = true;
                btn.innerText = "Cashout";
                btn.className = "btn-green";
                
                mult = 1.00;
                crash = (Math.random() * 3 + 1.1).toFixed(2);
                
                points = [{ x: 10, y: cvs.height - 10 }];

                timer = setInterval(() => {
                    mult += 0.03;
                    document.getElementById('multText').innerText = mult.toFixed(2) + 'x';
                    document.getElementById('multText').style.color = '#00ff66';

                    let last = points[points.length - 1];
                    let nextX = last.x + 3;
                    let nextY = cvs.height - 10 - Math.pow(nextX / 15, 1.6);

                    if (nextY < 20) nextY = 20;
                    points.push({ x: nextX, y: nextY });

                    drawGraph();

                    if (mult >= crash) {
                        clearInterval(timer);
                        document.getElementById('multText').innerText = 'CRASHED! (' + crash + 'x)';
                        document.getElementById('multText').style.color = '#e50914';
                        alert("Crash ho gaya!");
                        reset();
                    }
                }, 100);
            } else {
                clearInterval(timer);
                const win = Math.floor(bet * mult);
                balance += win;
                uRef.update({ balance: balance });
                alert(`Mubarak ho! Aapne ₹${win} jeete!`);
                reset();
            }
        }

        function reset() {
            running = false;
            const btn = document.getElementById('mainBtn');
            btn.innerText = "Place Bet";
            btn.className = "btn-red";
        }

        // Deposit Functionality
        function submitDeposit() {
            const amt = parseFloat(document.getElementById('depAmt').value);
            const utr = document.getElementById('depUtr').value.trim();
            if (!amt || amt <= 0) return alert("Sahi deposit amount daalein!");
            if (!utr || utr.length < 6) return alert("Sahi UTR number daalein!");

            db.ref('deposits').push({
                userId: user.id,
                userName: user.first_name,
                amount: amt,
                utr: utr,
                status: 'pending',
                time: Date.now()
            });

            alert("Deposit request submit ho gayi hai! Verification ke baad balance add ho jayega.");
            document.getElementById('depAmt').value = '';
            document.getElementById('depUtr').value = '';
        }

        // Withdrawal Functionality
        function withdraw() {
            const amt = parseFloat(document.getElementById('wAmt').value);
            const upi = document.getElementById('wUpi').value.trim();
            if (!amt || amt < 200) return alert("Min withdraw ₹200 hai!");
            if (!upi) return alert("UPI ID daalein!");
            if (amt > balance) return alert("Low balance!");

            db.ref('withdrawals').push({ userId: user.id, amount: amt, upi: upi, status: 'pending', time: Date.now() });
            uRef.update({ balance: balance - amt });
            alert("Withdraw request bhej di gayi hai!");
            document.getElementById('wAmt').value = '';
            document.getElementById('wUpi').value = '';
        }

        // Admin Fund Add/Deduct Action
        function adminBalance(isAdd) {
            const target = document.getElementById('targetUser').value.trim();
            const amt = parseFloat(document.getElementById('addAmt').value);
            if (!target || !amt || amt <= 0) return alert("Target User ID aur Valid Amount daalein!");

            const tRef = db.ref('users/' + target + '/balance');
            tRef.transaction((curr) => {
                let currentBal = curr || 0;
                return isAdd ? (currentBal + amt) : Math.max(0, currentBal - amt);
            }, (error, committed) => {
                if (committed) {
                    alert(`Balance successfully ${isAdd ? 'Added' : 'Deducted'}!`);
                    document.getElementById('addAmt').value = '';
                } else {
                    alert("Failed to update balance!");
                }
            });
        }
    </script>
</body>
</html>
