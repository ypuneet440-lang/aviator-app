<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 15px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        #canvas-container { position: relative; width: 100%; height: 180px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
        canvas { width: 100%; height: 100%; display: block; }
        .mult { font-size: 30px; font-weight: bold; color: #00ff66; margin: 5px 0; }
        input { width: 90%; padding: 10px; margin: 6px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
        button { width: 95%; padding: 12px; font-weight: bold; font-size: 16px; border-radius: 8px; border: none; cursor: pointer; margin-top: 5px; }
        .btn-bet { background: #e50914; color: #fff; }
        .btn-support { background: #229ED9; color: #fff; display: block; text-decoration: none; font-weight: bold; padding: 12px; border-radius: 8px; margin-top: 10px; }
        .ref { font-size: 13px; color: #00ff66; word-break: break-all; background: #222; padding: 6px; border-radius: 6px; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>🚀 Aviator Game</h2>

    <div class="card">
        <div id="canvas-container">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div class="mult" id="multText">1.00x</div>
        <input type="number" id="betVal" placeholder="Bet Amount (₹)">
        <button id="mainBtn" class="btn-bet" onclick="action()">Place Bet</button>
    </div>

    <div class="card">
        <h3>Wallet Balance: ₹<span id="bal">0</span></h3>
        <p style="font-size:12px; color:#aaa;">ID: <span id="uId">...</span></p>
    </div>

    <div class="card">
        <h3>🎁 Refer & Earn (₹100)</h3>
        <div class="ref" id="refLink">Loading...</div>
    </div>

    <div class="card">
        <h3>💸 Withdraw (Min ₹200)</h3>
        <input type="number" id="wAmt" placeholder="Amount (Min ₹200)">
        <input type="text" id="wUpi" placeholder="UPI ID">
        <button class="btn-bet" onclick="withdraw()">Submit Request</button>
    </div>

    <a href="https://t.me/Yadav63070" target="_blank" class="btn-support">🎧 Contact Support</a>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe?.user || { id: "1234567", first_name: "User" };
        document.getElementById('uId').innerText = user.id;

        const firebaseConfig = { databaseURL: "https://aviator-app-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('refLink').innerText = `https://t.me/puneetrashibot?start=${user.id}`;

        let balance = 0;
        const uRef = db.ref('users/' + user.id);
        uRef.on('value', (s) => {
            const data = s.val();
            if (data) {
                balance = data.balance || 0;
                document.getElementById('bal').innerText = balance;
            } else {
                let refBy = tg.initDataUnsafe?.start_param;
                if (refBy && refBy !== user.id.toString()) {
                    db.ref('users/' + refBy + '/balance').transaction(c => (c || 0) + 100);
                }
                uRef.set({ name: user.first_name, balance: 0, referredBy: refBy || null });
            }
        });

        // Canvas Setup
        const cvs = document.getElementById('gameCanvas');
        const ctx = cvs.getContext('2d');
        cvs.width = cvs.offsetWidth;
        cvs.height = cvs.offsetHeight;

        let running = false, mult = 1.00, timer, crash = 0, bet = 0;

        function draw(x, y) {
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            ctx.fillStyle = '#e50914';
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.fill();
        }

        function action() {
            const btn = document.getElementById('mainBtn');
            if (!running) {
                const input = parseFloat(document.getElementById('betVal').value);
                if (!input || input <= 0) return alert("Valid amount daalein!");
                if (input > balance) return alert("Low balance!");
                
                bet = input;
                balance -= bet;
                uRef.update({ balance: balance });

                running = true;
                btn.innerText = "Cashout";
                btn.style.background = "#00ff66";
                btn.style.color = "#000";
                
                mult = 1.00;
                crash = (Math.random() * 3 + 1.1).toFixed(2);
                let px = 10, py = cvs.height - 20;

                timer = setInterval(() => {
                    mult += 0.03;
                    document.getElementById('multText').innerText = mult.toFixed(2) + 'x';
                    px += 2; py -= 1;
                    draw(px, py);

                    if (mult >= crash) {
                        clearInterval(timer);
                        document.getElementById('multText').innerText = 'CRASHED! (' + crash + 'x)';
                        document.getElementById('multText').style.color = '#e50914';
                        alert("Crash ho gaya!");
                        reset();
                    }
                }, 100);
            } else {
                clearInterval(timer);
                const win = Math.floor(bet * mult);
                balance += win;
                uRef.update({ balance: balance });
                alert(`Aapne ₹${win} jeete!`);
                reset();
            }
        }

        function reset() {
            running = false;
            const btn = document.getElementById('mainBtn');
            btn.innerText = "Place Bet";
            btn.style.background = "#e50914";
            btn.style.color = "#fff";
            document.getElementById('multText').style.color = '#00ff66';
            ctx.clearRect(0, 0, cvs.width, cvs.height);
        }

        function withdraw() {
            const amt = parseFloat(document.getElementById('wAmt').value);
            const upi = document.getElementById('wUpi').value.trim();
            if (!amt || amt < 200) return alert("Min withdraw ₹200 hai!");
            if (!upi) return alert("UPI ID daalein!");
            if (amt > balance) return alert("Low balance!");

            db.ref('withdrawals').push({ userId: user.id, amount: amt, upi: upi, status: 'pending', time: Date.now() });
            uRef.update({ balance: balance - amt });
            alert("Withdraw request bhej di gayi hai!");
        }
    </script>
</body>
</html>
