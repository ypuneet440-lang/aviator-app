<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Ad-To-Earn Game</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- MONETAG SDK -->
    <script src='//libtl.com/sdk.js' data-zone='11447350' data-sdk='show_11447350'></script>

    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0f172a; color: white; margin: 0; padding: 15px; text-align: center; }
        
        .nav-tabs { display: flex; justify-content: space-around; background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        .tab-btn { background: none; border: none; color: #94a3b8; font-size: 13px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; }

        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: left; }
        .card-center { text-align: center; }
        .balance-text { font-size: 22px; color: #22c55e; font-weight: bold; }

        #gameCanvas { background: #020617; border-radius: 10px; width: 100%; height: 200px; border: 1px solid #334155; }
        .multiplier { font-size: 32px; font-weight: bold; margin: 10px 0; color: #38bdf8; text-align: center; }
        .crashed { color: #ef4444; }

        .btn { border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-bet { background: #22c55e; color: white; }
        .btn-cashout { background: #eab308; color: black; }
        .btn-ad { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-withdraw { background: #3b82f6; color: white; }
        .btn-refer { background: #8b5cf6; color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; width: auto; margin-top: 5px; }

        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; margin-top: 8px; }
        .page { display: none; }
        .page.active { display: block; }
        .ref-box { background: #0f172a; padding: 10px; border-radius: 6px; word-break: break-all; font-size: 12px; border: 1px dashed #38bdf8; margin-top: 10px; }
        
        .user-item { background: #0f172a; border-radius: 8px; padding: 10px; margin-bottom: 10px; border: 1px solid #334155; font-size: 13px; }
        .user-edit-row { display: flex; gap: 8px; margin-top: 8px; }
        .user-edit-row input { margin-top: 0; }
    </style>
</head>
<body>

    <!-- Tab Navigation -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('gamePage', this)">✈️ Game</button>
        <button class="tab-btn" onclick="switchTab('referPage', this)">🤝 Refer</button>
        <button class="tab-btn" onclick="switchTab('withdrawPage', this)">💳 Withdraw</button>
        <button class="tab-btn" onclick="switchTab('adminPage', this)">⚙️ Admin</button>
    </div>

    <!-- User Balance Info -->
    <div class="card card-center">
        <div>Total Balance:</div>
        <div id="coinBalance" class="balance-text">0.0 Coins</div>
        <div style="font-size: 11px; color: #94a3b8; margin-top: 3px;">(10,000 Coins = ₹10.00)</div>
    </div>

    <!-- PAGE 1: AVIATOR GAME -->
    <div id="gamePage" class="page active">
        <div class="card card-center">
            <canvas id="gameCanvas"></canvas>
            <div id="multiDisplay" class="multiplier">1.00x</div>
            <input type="number" id="betAmount" value="50" placeholder="Bet Amount (Coins)">
            <button id="actionBtn" class="btn btn-bet" onclick="handleGameAction()">BET</button>
        </div>
        <button class="btn btn-ad" onclick="triggerAdFromGame()">🎥 Watch Ad (+100 Coins)</button>
    </div>

    <!-- PAGE 2: REFER & EARN -->
    <div id="referPage" class="page">
        <div class="card card-center">
            <h3>🎁 Refer & Earn</h3>
            <p style="font-size: 13px; color: #94a3b8;">Har friend ko invite karne par payein <b>10,000 Coins (₹10)</b>!</p>
            <div class="ref-box" id="refLinkText">Loading link...</div>
            <button class="btn btn-refer" onclick="copyReferLink()">📋 Copy Refer Link</button>
        </div>
    </div>

    <!-- PAGE 3: WITHDRAWAL -->
    <div id="withdrawPage" class="page">
        <div class="card">
            <h3 style="text-align: center;">Withdraw Earnings</h3>
            <p style="font-size: 12px; color: #94a3b8; text-align: center;">Minimum Withdrawal: 1,000 Coins (₹1.00)</p>
            <input type="text" id="upiId" placeholder="Enter UPI ID (e.g. 9876543210@paytm)">
            <input type="number" id="withdrawCoins" placeholder="Coins to withdraw">
            <button class="btn btn-withdraw" onclick="submitWithdrawal()">Request Withdrawal</button>
        </div>
    </div>

    <!-- PAGE 4: ADMIN PANEL -->
    <div id="adminPage" class="page">
        <div class="card">
            <h3>⚙️ Admin Control</h3>
            <label style="font-size:12px;">Manual Target Crash (Optional):</label>
            <input type="number" id="targetCrashInput" value="0" step="0.10" placeholder="0 for Automatic 30% Probability">
            <button class="btn btn-bet" onclick="setTargetCrash()">Save Override Crash</button>
        </div>

        <div class="card">
            <h3>👥 All Users Data</h3>
            <div id="adminUsersList">Loading users...</div>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const BOT_USERNAME = "uneetrashibot"; 
        const BOT_TOKEN = "7510349021:AAFEFZ1MuPY3Bh6mIlHto7UzVHITurxvcuc"; 
        const ADMIN_CHAT_ID = "6247495377"; 

        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyCreYezB7veF7EJ7GA9VMIAL0mJq-69T58",
            authDomain: "aviator-3b6b1.firebaseapp.com",
            databaseURL: "https://aviator-3b6b1-default-rtdb.firebaseio.com",
            projectId: "aviator-3b6b1",
            storageBucket: "aviator-3b6b1.firebasestorage.app",
            messagingSenderId: "963462673561",
            appId: "1:963462673561:web:7c9cdc9a68d38c5ce53408"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const user = tg.initDataUnsafe?.user || {};
        const userId = user.id ? user.id.toString() : "puneet_test_user";
        const firstName = user.first_name || "User";
        const username = user.username ? "@" + user.username : "No Username";

        const startParam = tg.initDataUnsafe?.start_param || "";

        // MONETAG ADS INITIALIZATION
        window.addEventListener('load', () => {
            if (typeof show_11447350 === 'function') {
                show_11447350({ 
                    type: 'inApp', 
                    inAppSettings: { frequency: 2, capping: 0.1, interval: 30, timeout: 5, everyPage: false } 
                });
            }
            const referUrl = `https://t.me/${BOT_USERNAME}?start=${userId}`;
            document.getElementById('refLinkText').innerText = referUrl;
            
            // Load Admin Data
            loadUsersForAdmin();
        });

        function sendTelegramAlert(message) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: message, parse_mode: 'Markdown' })
            }).catch(err => console.log(err));
        }

        let userCoins = 0;
        let isPlaying = false;
        let isCashedOut = false;
        let currentMultiplier = 1.00;
        let targetCrash = 1.20;
        let manualOverride = 0;
        let gameInterval = null;
        let currentBet = 0;

        // USER DATA & AUTOMATIC REFERRAL TRACKING
        const userRef = db.ref('users/' + userId);
        userRef.on('value', (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                userCoins = data.coins || 0;
                document.getElementById('coinBalance').innerText = `${userCoins.toFixed(1)} Coins`;
            } else {
                userRef.set({
                    coins: 100,
                    name: firstName,
                    username: username,
                    referredBy: startParam || "Direct",
                    joinedAt: new Date().toISOString()
                });

                sendTelegramAlert(`🚨 *New User Joined!*\n👤 Name: ${firstName}\n🔗 Username: ${username}\n🆔 ID: \`${userId}\`\n🤝 Referred By: \`${startParam || "Direct"}\``);

                if (startParam && startParam !== userId) {
                    const referrerRef = db.ref('users/' + startParam);
                    referrerRef.once('value', (refSnap) => {
                        if (refSnap.exists()) {
                            const currentRefCoins = refSnap.val().coins || 0;
                            referrerRef.child('coins').set(currentRefCoins + 10000);
                            sendTelegramAlert(`🎉 *Referral Reward Added!*\nReferrer ID \`${startParam}\` earned *10,000 Coins* for inviting ${firstName}!`);
                        }
                    });
                }
            }
        });

        db.ref('gameSettings/targetCrash').on('value', (snap) => {
            manualOverride = snap.val() || 0;
        });

        function switchTab(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            btn.classList.add('active');
        }

        function copyReferLink() {
            const link = document.getElementById('refLinkText').innerText;
            navigator.clipboard.writeText(link);
            tg.showAlert("Referral link copied!");
        }

        // AVIATOR GAME ENGINE
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        function drawCanvas(xRatio, yRatio, isCrash = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(10, canvas.height - 10);
            ctx.quadraticCurveTo(canvas.width / 2, canvas.height - 10, canvas.width - 20, canvas.height - (yRatio * (canvas.height - 30)));
            ctx.strokeStyle = isCrash ? '#ef4444' : '#38bdf8';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        function calculateCrashPoint() {
            if (manualOverride > 1.00) return manualOverride;
            const rand = Math.random();
            if (rand < 0.70) {
                return parseFloat((1.01 + Math.random() * 0.45).toFixed(2));
            } else {
                return parseFloat((1.50 + Math.random() * 3.50).toFixed(2));
            }
        }

        function handleGameAction() {
            const btn = document.getElementById('actionBtn');
            const betInput = parseInt(document.getElementById('betAmount').value);

            if (!isPlaying) {
                if (betInput > userCoins || betInput <= 0) {
                    tg.showAlert("Coins kam hain! Watch Ad ya Refer karke earn karein.");
                    return;
                }
                currentBet = betInput;
                userCoins -= currentBet;
                userRef.child('coins').set(userCoins);

                isPlaying = true;
                isCashedOut = false;
                currentMultiplier = 1.00;
                targetCrash = calculateCrashPoint();

                btn.innerText = "CASHOUT";
                btn.className = "btn btn-cashout";
                startPlaneFlight();
            } else if (isPlaying && !isCashedOut) {
                isCashedOut = true;
                const winCoins = currentBet * currentMultiplier;
                userCoins += winCoins;
                userRef.child('coins').set(userCoins);
                tg.showAlert(`🎉 Cashout Success! +${winCoins.toFixed(1)} Coins`);
                btn.innerText = "CASHED OUT";
                btn.style.opacity = "0.6";
            }
        }

        function startPlaneFlight() {
            const multiDisplay = document.getElementById('multiDisplay');
            multiDisplay.classList.remove('crashed');

            gameInterval = setInterval(() => {
                currentMultiplier += 0.03;
                multiDisplay.innerText = `${currentMultiplier.toFixed(2)}x`;
                drawCanvas(currentMultiplier / targetCrash, (currentMultiplier - 1) / (targetCrash - 1));

                if (currentMultiplier >= targetCrash) {
                    clearInterval(gameInterval);
                    multiDisplay.innerText = `CRASHED @ ${targetCrash.toFixed(2)}x`;
                    multiDisplay.classList.add('crashed');
                    drawCanvas(1, 1, true);

                    isPlaying = false;
                    const btn = document.getElementById('actionBtn');
                    btn.innerText = "BET";
                    btn.className = "btn btn-bet";
                    btn.style.opacity = "1";

                    if (!isCashedOut) {
                        setTimeout(() => { triggerAdFromGame(false); }, 800);
                    }
                }
            }, 100);
        }

        function triggerAdFromGame(rewardCoins = true) {
            if (typeof show_11447350 === 'function') {
                show_11447350().then(() => {
                    if (rewardCoins) {
                        userCoins += 100;
                        userRef.child('coins').set(userCoins);
                        tg.showAlert("🎉 100 Coins added!");
                    }
                }).catch(() => {
                    console.log("Ad skipped or failed");
                });
            } else {
                if (rewardCoins) {
                    userCoins += 100;
                    userRef.child('coins').set(userCoins);
                }
            }
        }

        function submitWithdrawal() {
            const upi = document.getElementById('upiId').value;
            const coins = parseInt(document.getElementById('withdrawCoins').value);

            if (!upi || coins < 1000 || coins > userCoins) {
                tg.showAlert("Invalid UPI ID ya kam balance (Min 1,000 Coins).");
                return;
            }

            triggerAdFromGame(false);

            userCoins -= coins;
            userRef.child('coins').set(userCoins);
            
            sendTelegramAlert(`💸 *New Withdrawal Request!*\n👤 User: ${firstName} (${username})\n💳 UPI: \`${upi}\`\n🪙 Coins: ${coins} (₹${(coins/1000).toFixed(2)})`);

            tg.showAlert("Withdrawal request submit ho gayi hai!");
        }

        function setTargetCrash() {
            const target = parseFloat(document.getElementById('targetCrashInput').value);
            db.ref('gameSettings/targetCrash').set(target);
            tg.showAlert(`Manual override multiplier set to ${target}x`);
        }

        // ADMIN REAL-TIME USER DATA & EDIT SYSTEM
        function loadUsersForAdmin() {
            db.ref('users').on('value', (snapshot) => {
                const listDiv = document.getElementById('adminUsersList');
                listDiv.innerHTML = "";

                if (!snapshot.exists()) {
                    listDiv.innerText = "No users found.";
                    return;
                }

                snapshot.forEach((childSnap) => {
                    const uId = childSnap.key;
                    const uData = childSnap.val();

                    const userBox = document.createElement('div');
                    userBox.className = 'user-item';
                    userBox.innerHTML = `
                        <div><b>${uData.name || 'User'}</b> (${uData.username || 'No Username'})</div>
                        <div style="font-size: 11px; color: #94a3b8;">ID: ${uId} | Referred By: ${uData.referredBy || 'Direct'}</div>
                        <div style="color:#22c55e; font-weight:bold; margin-top:3px;">Coins: ${uData.coins || 0}</div>
                        <div class="user-edit-row">
                            <input type="number" id="input_${uId}" placeholder="New Coins" value="${uData.coins || 0}">
                            <button class="btn btn-withdraw btn-sm" onclick="updateUserCoins('${uId}')">Update</button>
                        </div>
                    `;
                    listDiv.appendChild(userBox);
                });
            });
        }

        function updateUserCoins(targetUserId) {
            const val = parseFloat(document.getElementById(`input_${targetUserId}`).value);
            if (isNaN(val)) {
                tg.showAlert("Valid number daalein!");
                return;
            }
            db.ref('users/' + targetUserId + '/coins').set(val).then(() => {
                tg.showAlert(`User ${targetUserId} ke coins update hokar ${val} ho gaye!`);
            });
        }
    </script>
</body>
</html>
