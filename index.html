 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Mini App</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Firebase SDK (Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Adsgram SDK (Telegram Native Ads) -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <!-- MONETAG SDK SCRIPT (Aapka Exact Script & Zone ID Setup) -->
    <script src='//libtl.com/sdk.js' data-zone='11447350' data-sdk='show_11447350'></script>

    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .wallet-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .balance {
            font-size: 24px;
            color: #22c55e;
            font-weight: bold;
        }
        .ad-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }
        .ad-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h2>✈️ Aviator Crash Game</h2>

    <!-- User Wallet Section -->
    <div class="wallet-card">
        <div>Aapka Coin Balance:</div>
        <div id="coinBalance" class="balance">0 Coins</div>
        <div style="font-size: 12px; color: #94a3b8; margin-top: 5px;">(100 Coins = ₹0.10)</div>
    </div>

    <!-- Manual Watch Ad Button -->
    <button class="ad-btn" onclick="triggerAdFromGame()">
        🎥 Watch Ad (+100 Coins)
    </button>

    <script>
        // FIREBASE CONFIGURATION (Yahan apni firebase details daalein)
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Telegram User Identification
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || "test_user_123";

        const ADSGRAM_BLOCK_ID = "YOUR_ADSGRAM_BLOCK_ID"; 
        let adRotatorIndex = 0;

        // Sync Balance
        db.ref('users/' + userId + '/coins').on('value', (snapshot) => {
            const coins = snapshot.val() || 0;
            document.getElementById('coinBalance').innerText = `${coins.toFixed(1)} Coins`;
        });

        // AD TRIGGER SYSTEM
        function triggerAdFromGame() {
            if (adRotatorIndex === 0) {
                showMonetagAd();
                adRotatorIndex = 1;
            } else {
                showAdsgramAd();
                adRotatorIndex = 0;
            }
        }

        // Monetag Exact Ad Show Function
        function showMonetagAd() {
            if (typeof show_11447350 === 'function') {
                show_11447350().then(() => {
                    creditCoins(userId);
                }).catch(() => {
                    alert("Ad poora nahi dekha gaya!");
                });
            } else {
                showAdsgramAd();
            }
        }

        // Adsgram Ad Show
        function showAdsgramAd() {
            if (window.Adsgram) {
                const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
                AdController.show().then(() => {
                    creditCoins(userId);
                }).catch(() => {
                    console.log("Adsgram Ad closed or failed");
                });
            } else {
                creditCoins(userId);
            }
        }

        // COIN CREDIT & REFERRAL LOGIC
        function creditCoins(uId) {
            const REWARD_COINS = 100;
            const userRef = db.ref('users/' + uId);

            userRef.transaction((user) => {
                if (!user) {
                    user = { coins: 0, adViews: 0 };
                }
                user.coins = (user.coins || 0) + REWARD_COINS;
                user.adViews = (user.adViews || 0) + 1;

                if (user.referredBy) {
                    const commission = REWARD_COINS * 0.005; 
                    db.ref('users/' + user.referredBy + '/coins').transaction(c => (c || 0) + commission);
                }
                return user;
            }).then(() => {
                tg.showAlert("🎉 Sabhash! 100 Coins aapke wallet me add ho gaye hain.");
            });
        }
    </script>
</body>
</html>
