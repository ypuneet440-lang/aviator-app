<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Ad-To-Earn Game</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    
    <!-- MONETAG SDK -->
    <script src='//libtl.com/sdk.js' data-zone='11447350' data-sdk='show_11447350'></script>

    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0f172a; color: white; margin: 0; padding: 15px; text-align: center; }
        
        .nav-tabs { display: flex; justify-content: space-around; background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        .tab-btn { background: none; border: none; color: #94a3b8; font-size: 14px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; }

        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .balance-text { font-size: 22px; color: #22c55e; font-weight: bold; }

        #gameCanvas { background: #020617; border-radius: 10px; width: 100%; height: 200px; border: 1px solid #334155; }
        .multiplier { font-size: 32px; font-weight: bold; margin: 10px 0; color: #38bdf8; }
        .crashed { color: #ef4444; }

        .btn { border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-bet { background: #22c55e; color: white; }
        .btn-cashout { background: #eab308; color: black; }
        .btn-ad { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-withdraw { background: #3b82f6; color: white; }

        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; margin-top: 8px; }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <!-- Tab Navigation -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('gamePage', this)">✈️ Game</button>
        <button class="tab-btn" onclick="switchTab('withdrawPage', this)">💳 Withdraw</button>
        <button class="tab-btn" onclick="switchTab('adminPage', this)">⚙️ Admin</button>
    </div>

    <!-- User Balance Info -->
    <div class="card">
        <div>Total Balance:</div>
        <div id="coinBalance" class="balance-text">0.0 Coins</div>
        <div style="font-size: 11px; color: #94a3b8; margin-top: 3px;">(100 Coins = ₹0.10)</div>
    </div>

    <!-- PAGE 1: AVIATOR GAME -->
    <div id="gamePage" class="page active">
        <div class="card">
            <canvas id="gameCanvas"></canvas>
            <div id="multiDisplay" class="multiplier">1.00x</div>
            <input type="number" id="betAmount" value="50" placeholder="Bet Amount (Coins)">
            <button id="actionBtn" class="btn btn-bet" onclick="handleGameAction()">BET</button>
        </div>
        <button class="btn btn-ad" onclick="triggerAdFromGame()">🎥 Watch Ad (+100 Coins)</button>
    </div>

    <!-- PAGE 2: WITHDRAWAL -->
    <div id="withdrawPage" class="page">
        <div class="card">
            <h3>Withdraw Earnings</h3>
            <p style="font-size: 12px; color: #94a3b8;">Minimum Withdrawal: 1,000 Coins (₹1.00)</p>
            <input type="text" id="upiId" placeholder="Enter UPI ID (e.g. 9876543210@paytm)">
            <input type="number" id="withdrawCoins" placeholder="Coins to withdraw">
            <button class="btn btn-withdraw" onclick="submitWithdrawal()">Request Withdrawal</button>
        </div>
    </div>

    <!-- PAGE 3: ADMIN PANEL -->
    <div id="adminPage" class="page">
        <div class="card">
            <h3>Admin Control</h3>
            <label style="font-size:12px;">Manual Target Crash (Optional):</label>
            <input type="number" id="targetCrashInput" value="0" step="0.10" placeholder="0 for Automatic 30% Probability">
            <button class="btn btn-bet" onclick="setTargetCrash()">Save Override Crash</button>
        </div>
    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyCreYezB7veF7EJ7GA9VMIAL0mJq-69T58", // Auto-loaded from project
            authDomain: "aviator-3b6b1.firebaseapp.com",
            databaseURL: "https://aviator-3b6b1-default-rtdb.firebaseio.com",
            projectId: "aviator-3b6b1",
            storageBucket: "aviator-3b6b1.firebasestorage.app",
            messagingSenderId: "963462673561",
            appId: "1:963462673561:web:7c9cdc9a68d38c5ce53408"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const user = tg.initDataUnsafe?.user || {};
        const userId = user.id ? user.id.toString() : "puneet_test_user";
        const firstName = user.first_name || "User";
        const username = user.username ? "@" + user.username : "No Username";

        const BOT_TOKEN = "7510349021:AAFEFZ1MuPY3Bh6mIlHto7UzVHITurxvcuc"; 
        const ADMIN_CHAT_ID = "6247495377"; 

        // MONETAG IN-APP INTERSTITIAL AUTOMATIC TRIGGER SETUP
        window.addEventListener('load', () => {
            if (typeof show_11447350 === 'function') {
                show_11447350({ 
                    type: 'inApp', 
                    inAppSettings: { 
                        frequency: 2, 
                        capping: 0.1, 
                        interval: 30, 
                        timeout: 5, 
                        everyPage: false 
                    } 
                });
            }
        });

        function sendTelegramAlert(message) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: message, parse_mode: 'Markdown' })
            }).catch(err => console.log(err));
        }

        let userCoins = 0;
        let isPlaying = false;
        let isCashedOut = false;
        let currentMultiplier = 1.00;
        let targetCrash = 1.20;
        let manualOverride = 0;
        let gameInterval = null;
        let currentBet = 0;

        const userRef = db.ref('users/' + userId);
        userRef.on('value', (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                userCoins = data.coins || 0;
                document.getElementById('coinBalance').innerText = `${userCoins.toFixed(1)} Coins`;
            } else {
                userRef.set({
                    coins: 100,
                    name: firstName,
                    username: username,
                    joinedAt: new Date().toISOString()
                });
                sendTelegramAlert(`🚨 *New User Joined!* \n👤 Name: ${firstName} \n🔗 Username: ${username} \n🆔 ID: \`${userId}\``);
            }
        });

        db.ref('gameSettings/targetCrash').on('value', (snap) => {
            manualOverride = snap.val() || 0;
        });

        function switchTab(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            btn.classList.add('active');
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        function drawCanvas(xRatio, yRatio, isCrash = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(10, canvas.height - 10);
            ctx.quadraticCurveTo(canvas.width / 2, canvas.height - 10, canvas.width - 20, canvas.height - (yRatio * (canvas.height - 30)));
            ctx.strokeStyle = isCrash ? '#ef4444' : '#38bdf8';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        function calculateCrashPoint() {
            if (manualOverride > 1.00) return manualOverride;
            const rand = Math.random();
            if (rand < 0.70) {
                return parseFloat((1.01 + Math.random() * 0.45).toFixed(2));
            } else {
                return parseFloat((1.50 + Math.random() * 3.50).toFixed(2));
            }
        }

        function handleGameAction() {
            const btn = document.getElementById('actionBtn');
            const betInput = parseInt(document.getElementById('betAmount').value);

            if (!isPlaying) {
                if (betInput > userCoins || betInput <= 0) {
                    tg.showAlert("Coins kam hain! Watch Ad par click karke earn karein.");
                    return;
                }
                currentBet = betInput;
                userCoins -= currentBet;
                userRef.child('coins').set(userCoins);

                isPlaying = true;
                isCashedOut = false;
                currentMultiplier = 1.00;
                targetCrash = calculateCrashPoint();

                btn.innerText = "CASHOUT";
                btn.className = "btn btn-cashout";
                startPlaneFlight();
            } else if (isPlaying && !isCashedOut) {
                isCashedOut = true;
                const winCoins = currentBet * currentMultiplier;
                userCoins += winCoins;
                userRef.child('coins').set(userCoins);
                tg.showAlert(`🎉 Cashout Success! +${winCoins.toFixed(1)} Coins`);
                btn.innerText = "CASHED OUT";
                btn.style.opacity = "0.6";
            }
        }

        function startPlaneFlight() {
            const multiDisplay = document.getElementById('multiDisplay');
            multiDisplay.classList.remove('crashed');

            gameInterval = setInterval(() => {
                currentMultiplier += 0.03;
                multiDisplay.innerText = `${currentMultiplier.toFixed(2)}x`;
                drawCanvas(currentMultiplier / targetCrash, (currentMultiplier - 1) / (targetCrash - 1));

                if (currentMultiplier >= targetCrash) {
                    clearInterval(gameInterval);
                    multiDisplay.innerText = `CRASHED @ ${targetCrash.toFixed(2)}x`;
                    multiDisplay.classList.add('crashed');
                    drawCanvas(1, 1, true);

                    isPlaying = false;
                    const btn = document.getElementById('actionBtn');
                    btn.innerText = "BET";
                    btn.className = "btn btn-bet";
                    btn.style.opacity = "1";

                    if (!isCashedOut) {
                        setTimeout(() => { triggerAdFromGame(false); }, 800);
                    }
                }
            }, 100);
        }

        function triggerAdFromGame(rewardCoins = true) {
            if (typeof show_11447350 === 'function') {
                show_11447350().then(() => {
                    if (rewardCoins) {
                        userCoins += 100;
                        userRef.child('coins').set(userCoins);
                        tg.showAlert("🎉 100 Coins added!");
                    }
                }).catch(() => {
                    console.log("Ad skipped or failed");
                });
            } else {
                if (rewardCoins) {
                    userCoins += 100;
                    userRef.child('coins').set(userCoins);
                }
            }
        }

        function submitWithdrawal() {
            const upi = document.getElementById('upiId').value;
            const coins = parseInt(document.getElementById('withdrawCoins').value);

            if (!upi || coins < 1000 || coins > userCoins) {
                tg.showAlert("Invalid UPI ID ya kam balance (Min 1,000 Coins).");
                return;
            }

            triggerAdFromGame(false);

            userCoins -= coins;
            userRef.child('coins').set(userCoins);
            
            sendTelegramAlert(`💸 *New Withdrawal Request!*\n👤 User: ${firstName} (${username})\n💳 UPI: \`${upi}\`\n🪙 Coins: ${coins} (₹${(coins/1000).toFixed(2)})`);

            tg.showAlert("Withdrawal request submit ho gayi hai!");
        }

        function setTargetCrash() {
            const target = parseFloat(document.getElementById('targetCrashInput').value);
            db.ref('gameSettings/targetCrash').set(target);
            tg.showAlert(`Manual override multiplier set to ${target}x`);
        }
    </script>
</body>
</html>
