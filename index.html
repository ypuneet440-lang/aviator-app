 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator Telegram App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #0f1721;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      text-align: center;
    }
    .card {
      background: #1a2634;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .balance-box {
      font-size: 22px;
      font-weight: bold;
      color: #38bdf8;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-deposit { background: #22c55e; color: white; }
    .btn-withdraw { background: #f97316; color: white; }
    .btn-action { background: #ef4444; color: white; width: 100%; padding: 12px; font-size: 18px; margin-top: 10px; }
    .btn-admin { background: #a855f7; color: white; margin-top: 10px; }
    
    .tab-content { display: none; }
    .active { display: block; }
    
    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f1721;
      color: white;
      text-align: center;
    }
    .game-screen {
      height: 180px;
      background: #000;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      color: #22c55e;
      position: relative;
    }
    .qr-img {
      width: 180px;
      height: 180px;
      margin: 10px 0;
      border-radius: 8px;
      background: white;
      padding: 5px;
    }
  </style>
</head>
<body>

  <!-- Header & Balance -->
  <div class="card">
    <div>Wallet Balance</div>
    <div class="balance-box">₹<span id="user-balance">500.00</span></div>
    <div class="btn-group">
      <button class="btn-deposit" onclick="showTab('deposit-tab')">➕ Deposit</button>
      <button class="btn-withdraw" onclick="showTab('withdraw-tab')">➖ Withdraw</button>
    </div>
  </div>

  <!-- Game Section -->
  <div id="game-tab" class="tab-content active card">
    <div class="game-screen" id="display">
      <span id="multiplier">1.00x</span>
    </div>
    <input type="number" id="bet-amount" value="50" placeholder="Bet Amount (₹)">
    <button class="btn-action" id="game-btn" onclick="toggleGame()">BET (START)</button>
    <button class="btn-admin" onclick="showTab('admin-tab')">⚙️ Admin Control Panel</button>
  </div>

  <!-- Deposit Section -->
  <div id="deposit-tab" class="tab-content card">
    <h3>Add Funds (UPI QR)</h3>
    <p style="font-size: 13px; color: #94a3b8;">Scan & Pay via Google Pay, PhonePe, Paytm</p>
    
    <!-- Auto Generated UPI QR Code for ypuneet440@okaxis -->
    <img class="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=ypuneet440@okaxis%26pn=Puneet%20Yadav" alt="UPI QR">
    
    <p>UPI ID: <b>ypuneet440@okaxis</b></p>
    <input type="number" id="dep-amount" placeholder="Enter Paid Amount (₹)">
    <input type="text" id="dep-utr" placeholder="Enter 12-Digit UTR/Ref No.">
    <button class="btn-deposit" onclick="submitDeposit()">Submit Payment Proof</button>
    <button style="background:#64748b; color:white; margin-top:8px;" onclick="showTab('game-tab')">Back to Game</button>
  </div>

  <!-- Withdraw Section -->
  <div id="withdraw-tab" class="tab-content card">
    <h3>Withdraw Funds</h3>
    <input type="number" id="wd-amount" placeholder="Enter Amount (Min ₹200)">
    <input type="text" id="wd-upi" placeholder="Enter Your UPI ID">
    <button class="btn-withdraw" onclick="submitWithdraw()">Submit Withdrawal Request</button>
    <button style="background:#64748b; color:white; margin-top:8px;" onclick="showTab('game-tab')">Back to Game</button>
  </div>

  <!-- Admin Control Panel -->
  <div id="admin-tab" class="tab-content card">
    <h3>⚙️ Admin Owner Panel</h3>
    <p style="font-size: 12px; color: #cbd5e1;">Control User Balance & Profit Settings</p>
    
    <label>Set Wallet Balance (₹):</label>
    <input type="number" id="admin-set-bal" value="500">
    <button class="btn-deposit" style="margin-bottom: 12px;" onclick="updateBalance()">Update Balance</button>
    
    <label>User Win Probability (0.1 = 10% Win, 0.8 = 80% Win):</label>
    <input type="number" step="0.1" id="admin-win-rate" value="0.3">
    
    <button class="btn-withdraw" onclick="saveAdminSettings()">Save Profit Settings</button>
    <button style="background:#64748b; color:white; margin-top:8px;" onclick="showTab('game-tab')">Back to Game</button>
  </div>

  <script>
    let tg = window.Telegram.WebApp;
    if(tg) tg.expand();

    let balance = 500.00;
    let winProbability = 0.3; // Default 30% User Win Rate
    let isPlaying = false;
    let timer = null;
    let currentMultiplier = 1.00;

    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
    }

    function toggleGame() {
      let btn = document.getElementById('game-btn');
      let multText = document.getElementById('multiplier');
      let bet = parseFloat(document.getElementById('bet-amount').value);

      if (!isPlaying) {
        if (bet > balance || isNaN(bet) || bet <= 0) {
          alert("Insufficient or Invalid Balance!");
          return;
        }

        // Deduct Bet
        balance -= bet;
        document.getElementById('user-balance').innerText = balance.toFixed(2);

        isPlaying = true;
        btn.innerText = "CASH OUT";
        btn.style.background = "#22c55e";

        currentMultiplier = 1.00;
        let isWinRound = Math.random() < winProbability;
        let crashPoint = isWinRound ? (Math.random() * 4 + 1.5).toFixed(2) : (Math.random() * 0.3 + 1.05).toFixed(2);

        timer = setInterval(() => {
          currentMultiplier += 0.05;
          multText.innerText = currentMultiplier.toFixed(2) + 'x';

          if (currentMultiplier >= crashPoint) {
            clearInterval(timer);
            multText.innerText = "CRASHED @ " + crashPoint + "x";
            multText.style.color = "#ef4444";
            btn.innerText = "BET (START)";
            btn.style.background = "#ef4444";
            isPlaying = false;
            
            setTimeout(() => { multText.style.color = "#22c55e"; }, 1500);
          }
        }, 80);

      } else {
        // Cashout Action
        clearInterval(timer);
        let winAmt = bet * currentMultiplier;
        balance += winAmt;
        document.getElementById('user-balance').innerText = balance.toFixed(2);

        alert("Cashed Out Successfully! Won: ₹" + winAmt.toFixed(2));
        btn.innerText = "BET (START)";
        btn.style.background = "#ef4444";
        isPlaying = false;
      }
    }

    function submitDeposit() {
      let amt = document.getElementById('dep-amount').value;
      let utr = document.getElementById('dep-utr').value;
      if (!amt || !utr) {
        alert("Enter Amount and UTR Number!");
        return;
      }
      if(tg && tg.sendData) {
        tg.sendData(JSON.stringify({ action: "DEPOSIT", amount: amt, utr: utr }));
      }
      alert("Deposit Request Submitted! Verification Pending.");
      showTab('game-tab');
    }

    function submitWithdraw() {
      let amt = parseFloat(document.getElementById('wd-amount').value);
      let upi = document.getElementById('wd-upi').value;
      if (amt > balance) {
        alert("Insufficient Balance!");
        return;
      }
      if (!amt || !upi) {
        alert("Enter valid Amount & UPI ID!");
        return;
      }
      balance -= amt;
      document.getElementById('user-balance').innerText = balance.toFixed(2);
      if(tg && tg.sendData) {
        tg.sendData(JSON.stringify({ action: "WITHDRAW", amount: amt, upi: upi }));
      }
      alert("Withdrawal Request Submitted!");
      showTab('game-tab');
    }

    function updateBalance() {
      let newBal = parseFloat(document.getElementById('admin-set-bal').value);
      if (!isNaN(newBal)) {
        balance = newBal;
        document.getElementById('user-balance').innerText = balance.toFixed(2);
        alert("Balance Updated to ₹" + newBal);
      }
    }

    function saveAdminSettings() {
      let rate = parseFloat(document.getElementById('admin-win-rate').value);
      if (!isNaN(rate) && rate >= 0 && rate <= 1) {
        winProbability = rate;
        alert("Win Probability Set to " + (rate * 100) + "%");
        showTab('game-tab');
      } else {
        alert("Value must be between 0 and 1");
      }
    }
  </script>
</body>
</html>
